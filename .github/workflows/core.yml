# contrast-core の CI。
name: core

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # toolchain を指定しないので rust-toolchain.toml（stable, rustfmt, clippy,
      # llvm-tools, x86_64-unknown-none）がそのまま入る。
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: scripts/verify.sh


  mutants-coverage:
    # コードが空の P0 では意味がないので無効にしておく。P8（硬化と API 凍結）で有効にする。
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-llvm-cov
      - name: PR の差分を取る
        if: github.event_name == 'pull_request'
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
      - name: 差分ミュータント
        if: github.event_name == 'pull_request'
        run: cargo mutants -p contrast-core --in-diff pr.diff
      - name: 行カバレッジ 95%
        run: cargo llvm-cov -p contrast-core --all-features --fail-under-lines 95
