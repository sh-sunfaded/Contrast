[package]
name = "contrast-wm"
version = "0.1.0"
edition = "2024"

[dependencies]

[workspace]
members = [
    "crates/contrast-core",
    "crates/contrast-policy",
    "crates/contrast-policy-cdl",
    "crates/contrast-compositor",
    "crates/contrast",
]

# リンク時のメモリを減らす
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
