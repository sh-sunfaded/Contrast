[package]
name = "contrast-policy-cdl"
version = "0.1.0"
edition = "2024"
publish = false
description = "Contrast の設定を CDL（cdl-host）で読むアダプタ。CDL に触れるのはこのクレートだけ"

[dependencies]
contrast-core = { path = "../contrast-core" }
contrast-policy = { path = "../contrast-policy" }
# origin/main のコミットで固定する（CI が再現できるように）。手元の ~/RustroverProjects/cdl への差し替えは
# リポジトリに入れない .cargo/config.toml の [patch] で行う。
cdl-host = { git = "https://github.com/sh-sunfaded/cdl.git", rev = "923136d2ca204ec57108edcd988a893f2941f771" }

[dev-dependencies]
proptest = "1.12.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
