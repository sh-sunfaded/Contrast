[package]
name = "contrast-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Contrast の純粋な状態遷移エンジン（no_std・依存なし）"

[lib]
path = "src/lib.rs"

[[test]]
name = "spec"
path = "tests/spec/main.rs"

[features]
default = []
invariants = []

[dependencies]

[dev-dependencies]
proptest = "1.12.0"
proptest-state-machine = "0.9.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
missing_docs_in_private_items = "deny"
